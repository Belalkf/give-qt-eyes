[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "give-qt-eyes"
version = "0.1.0"
description = "Check Qt layouts with screenshots and saved measurements"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Belal Alkufri"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
qt = ["PySide6>=6.5,<7"]

[project.scripts]
give-qt-eyes = "give_qt_eyes.cli:main"

[project.urls]
Homepage = "https://github.com/Belalkf/give-qt-eyes"
Issues = "https://github.com/Belalkf/give-qt-eyes/issues"

[tool.setuptools]
include-package-data = false
packages = ["give_qt_eyes", "give_qt_eyes._skill"]
package-dir = {give_qt_eyes = "src/give_qt_eyes", "give_qt_eyes._skill" = "skills/give-qt-eyes"}

[tool.setuptools.package-data]
"give_qt_eyes._skill" = ["SKILL.md", "agents/*.yaml", "references/*.md", "scripts/*.py"]
